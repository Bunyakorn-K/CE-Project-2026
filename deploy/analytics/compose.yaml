name: analytics
services:
  airflow-init:
    command: db migrate
    environment: &airflow-env
      AIRFLOW__API__BASE_URL: http://127.0.0.1:8080
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__PIP_PACKAGES: clickhouse-driver==0.2.6,requests==2.32.3,psycopg2-binary==2.9.10
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@analytics-postgres-1:5432/airflow
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: 'true'
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_USERNAME: admin
    image: apache/airflow:3.3.1
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
    - airflow-data:/opt/airflow
    - ./dags:/opt/airflow/dags
  airflow-webserver:
    command: api-server
    environment: *airflow-env
    healthcheck:
      interval: 30s
      retries: 30
      test:
      - CMD
      - curl
      - -sf
      - http://127.0.0.1:8080/api/v2/monitor/health
      timeout: 10s
      start_period: 60s
    image: apache/airflow:3.3.1
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
    - 8081:8080
    restart: unless-stopped
    volumes:
    - airflow-data:/opt/airflow
    - ./dags:/opt/airflow/dags
  airflow-scheduler:
    command: scheduler
    environment:
      <<: *airflow-env
      AIRFLOW__API__BASE_URL: http://analytics-airflow-webserver-1:8080
    image: apache/airflow:3.3.1
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
    - airflow-data:/opt/airflow
    - ./dags:/opt/airflow/dags
  airflow-triggerer:
    command: triggerer
    environment:
      <<: *airflow-env
      AIRFLOW__API__BASE_URL: http://analytics-airflow-webserver-1:8080
    image: apache/airflow:3.3.1
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
    - airflow-data:/opt/airflow
    - ./dags:/opt/airflow/dags
  airflow-dag-processor:
    command: dag-processor
    environment:
      <<: *airflow-env
      AIRFLOW__API__BASE_URL: http://analytics-airflow-webserver-1:8080
    image: apache/airflow:3.3.1
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
    - airflow-data:/opt/airflow
    - ./dags:/opt/airflow/dags
  postgres:
    environment:
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_USER: airflow
    healthcheck:
      interval: 10s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U airflow -d airflow
      timeout: 5s
    image: postgres:16
    ports:
    - 127.0.0.1:5433:5432
    restart: unless-stopped
    volumes:
    - postgres-airflow-data:/var/lib/postgresql/data
  clickhouse:
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # Stop the image entrypoint from writing users.d/default-user.xml, which
      # defines `admin` with <networks><ip>::/0</ip></networks> (internet-wide).
      # admin is instead created by clickhouse-admin-networks.xml below, scoped
      # to 127.0.0.1 + 172.16.0.0/12. Two users.d files defining the same user
      # makes ClickHouse fail auth with 516, so there must be exactly one.
      CLICKHOUSE_SKIP_USER_SETUP: 1
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD}
      CLICKHOUSE_USER: admin
    healthcheck:
      interval: 15s
      retries: 10
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8123/ping
      timeout: 5s
    image: clickhouse/clickhouse-server:26.3
    ports:
    - 8123:8123
    - 127.0.0.1:9009:9000
    restart: unless-stopped
    ulimits:
      nofile:
        hard: 262144
        soft: 262144
    volumes:
    # The warehouse lives in an EXTERNAL volume created by hand on the host
    # (see the top-level `volumes:` block). Mounting the compose-managed
    # `clickhouse-data` name instead comes up as an empty warehouse, which reads
    # as total data loss on a warehouse that is in fact intact.
    - clickhouse-data-restored:/var/lib/clickhouse
    - ./clickhouse-listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
    # 3 GiB server RAM cap. Without it ClickHouse competes with Airflow and
    # Superset for the 10 GB host and the kernel OOM killer took the whole box
    # down (2026-09-16) -> 502s on every proxied app.
    - ./clickhouse-memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    - ./clickhouse-alias-settings.xml:/etc/clickhouse-server/users.d/alias-settings.xml:ro
    - ./clickhouse-admin-networks.xml:/etc/clickhouse-server/users.d/admin-networks.xml:ro
    - ./clickhouse-reader.xml:/etc/clickhouse-server/users.d/reader.xml:ro
  mcp-inspector:
    command: npx -y @modelcontextprotocol/inspector
    environment:
      ALLOWED_ORIGINS: https://mcp.laundrytwin.duckdns.org
      DANGEROUSLY_BIND_ALL_INTERFACES: 'true'
      DANGEROUSLY_OMIT_AUTH: 'false'
      HOST: 0.0.0.0
    image: node:24-bookworm-slim
    ports:
    - 127.0.0.1:6274:6274
    restart: unless-stopped
  redis:
    command: redis-server --save 60 1 --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:8-alpine
    restart: unless-stopped
  superset:
    build:
      context: ./superset-driver
    image: laundrytwin-superset:6.1.0-clickhouse
    environment:
      SERVER_WORKER_AMOUNT: '2'
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      # Superset connects to its own `superset` database as the least-privilege
      # `superset_app` role, not as the Airflow superuser `airflow`. `airflow` is
      # a superuser: it owns the Airflow metadata database, can create roles, and
      # can read the ETL connection strings, none of which Superset needs.
      # Nothing in this repository or in tofu creates the `superset` database or
      # the `superset_app` role - the `postgres` service above only initialises
      # `airflow`/`airflow`, so a new host needs both created by hand before
      # this URI can connect. bootstrap-superset.sh step 0 runs `superset db
      # upgrade` (Alembic) as whichever role this URI names, so that role must
      # own the `superset` database or hold CREATE/ALTER on its schema. The
      # grants that actually exist on any given host are not recorded here.
      SUPERSET_DATABASE_URI: postgresql+psycopg2://superset_app:${SUPERSET_DB_PASSWORD}@analytics-postgres-1:5432/superset
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      interval: 30s
      retries: 10
      test:
      - CMD
      - curl
      - -sf
      - http://127.0.0.1:8088/health
      timeout: 10s
    ports:
    - 8088:8088
    restart: unless-stopped
    volumes:
    - superset-home:/app/superset_home
    - ./superset_config.py:/app/superset_config.py:ro
volumes:
  airflow-data: null
  postgres-airflow-data: null
  superset-home: null
  # The live warehouse volume, created by hand on the host (2026-09). Declared
  # external so compose adopts it instead of creating a fresh empty one; on a
  # NEW host it must be created first
  # (`docker volume create analytics_clickhouse-data-restored`) or `up` fails.
  clickhouse-data-restored:
    external: true
    name: analytics_clickhouse-data-restored
  # `clickhouse-data` is deliberately absent: nothing mounts it, and re-attaching
  # the compose-managed name comes up as an empty warehouse. The volume
  # `analytics_clickhouse-data` nevertheless still exists on the VM.
  #
  # DO NOT remove or prune it without an explicit, recorded decision. It held
  # data missing from the live warehouse - the 2026-08-31 -> 2026-09-16 window
  # (~2,617 usage rows, ~205,857 temperature rows) - and a data-recovery merge on
  # 2026-09-30 inserted that window into `analytics_clickhouse-data-restored`.
  # The volume is therefore no longer the only copy, but it is NOT disposable
  # either: the merge inserted a de-duplicated set, this volume still carries
  # pre-existing duplicate rows that were deliberately not merged, and nothing
  # has verified the two are equivalent. Staged source files and the rollback
  # recipe are in /opt/backups/pre-merge-20260930/ on the VM.
  #
  # Do not use docs/04_traceability/ops-incident-2026-09-14-clickhouse-lock.md as
  # a volume procedure. It is a crash-loop writeup from when this volume WAS the
  # production warehouse, and its fix block runs
  # `docker run -v analytics_clickhouse-data:/data ... rm -f /data/status`, which
  # writes to this volume.
