# CodeQL: static security analysis for the TypeScript/JavaScript surfaces
# (Hono API, React web, ETL). Results appear in the repo Security tab.
# Docs: https://docs.github.com/en/code-security/code-scanning

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-analyze weekly to catch newly discovered vulnerability classes.
    - cron: "30 2 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      # Required for CodeQL to upload SARIF results.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Only scan app source; skip vendored/generated trees if any appear.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
