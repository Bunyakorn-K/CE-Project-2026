# Dependency Review: on every PR, fail if new/updated dependencies carry
# known CVEs (>= moderate) or are flagged malicious (e.g. from OSV).
# Complements Dependabot alerts (enabled by default on public repos).
# Docs: https://docs.github.com/en/code-security/supply-chain-security

name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Check vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # Block only NEW vulnerabilities introduced by this PR.
          comment-summary-in-pr: always
