name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build / Test / Check (Node 24)
    runs-on: ubuntu-latest
    # build + test + check, plus installing Chromium and running the layout
    # suite. Build comes first because spa-bundle.test.ts reads the real
    # apps/web/dist and fails rather than skips when it is absent. The layout
    # step has its own, tighter budget; this is the backstop
    # for a hung build.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          # Node 24.x, resolved from .nvmrc so the pin lives in one place.
          # Must come after pnpm/action-setup: the cache input shells out to
          # `pnpm store path`.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Deliberately AFTER `pnpm build`. `apps/web/dist` is gitignored, so on a
      # fresh runner it does not exist until something builds it, and
      # `spa-bundle.test.ts` runs the SPA handler against that real bundle —
      # it skips when the bundle is absent. Testing first therefore skipped it
      # on every CI run, which is the failure this repo already paid for once:
      # a suite that stops running looks identical to one that passes, and the
      # green tick says nothing. The test found `/fonts/README.md` untypable on
      # its first run, which no fixture-based test could have.
      #
      # This is why the order is Test -> Check and not the reverse. `pnpm test`
      # needs no build output of its own, so the only cost is wall clock.
      - name: Test
        run: pnpm test

      - name: Check (lint + types)
        run: pnpm check

      # The layout suite is deliberately not in `pnpm test`, so nothing else
      # runs it. `--with-deps` because this is a headless Linux container and
      # the browser's shared libraries and base fonts are not the runner's
      # defaults.
      - name: Install Chromium for the layout suite
        run: pnpm --filter @laundrytwin/web exec playwright install --with-deps chromium

      # `webServer` in playwright.config.ts runs `pnpm build && vite preview`
      # and allows 180s for it, so 10 minutes for the whole step leaves room for
      # the browser run, 6 workers and the 1 retry the config enables when CI
      # is set.
      #
      # FONT WARNING, read before "fixing" a red run here. This step used to
      # depend on the runner's installed fonts: the suite asserted the topbar was
      # exactly 72px at 1172px, and the owner header's intrinsic width sat within
      # about 5px of that boundary, so installing a Thai font (or changing which
      # font the runner picked) could fail the step. Measured in Chromium against
      # the built bundle on 2026-09-28: 1171.31px with a local macOS stack (0.69px
      # of headroom), 1176.09px when Noto Sans Thai resolved (4.09px over, and the
      # topbar became 83px).
      #
      # That is fixed as of 2026-09-28: `apps/web/public/fonts/` vendors a
      # subsetted Noto Sans Thai woff2 and `styles.css` declares it with
      # `@font-face`, so the runner resolves the same font the measurements were
      # taken with. The suite now asserts 1173/1174 against a re-measured 1173.30px
      # intrinsic width. Do NOT "fix" a red run here by `apt-get install
      # fonts-noto-core`; the vendored font already wins the cascade, and a red run
      # is a real regression. If the font is ever dropped from `public/fonts/`, the
      # fragility comes straight back.
      - name: Layout regression suite (Playwright, Chromium)
        # VITE_LIFF_ID is a PLACEHOLDER, not the real channel ID, and must never
        # be the real one here: these specs abort every *.line.me request, so the
        # value only has to be non-empty for the LIFF gate to compile its branches
        # in. Without it, the 9 specs in `stale-liff-session.pw.ts` and
        # `closed-branch-honesty.pw.ts` skip and CI reports a green "56 passed"
        # that has quietly stopped covering the production defect they exist
        # for. Verified 2026-10-03: 65 passed with this set, 56 passed and 9
        # skipped with it absent.
        env:
          VITE_LIFF_ID: ci-placeholder-not-a-real-liff-id
        run: |
          set -o pipefail
          pnpm --filter @laundrytwin/web test:layout 2>&1 | tee /tmp/layout.log
          # A skipped spec is not a pass. Fail the build if the suite skipped
          # anything, so a future env change cannot re-hide these assertions
          # behind a green tick.
          if grep -qE '^ *[0-9]+ skipped' /tmp/layout.log; then
            echo "::error::the layout suite skipped tests — see the count above"
            exit 1
          fi
        timeout-minutes: 10
