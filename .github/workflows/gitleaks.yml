name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history sweep, Mondays 02:00 UTC.
    - cron: "0 2 * * 1"

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so scheduled sweeps see everything

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
