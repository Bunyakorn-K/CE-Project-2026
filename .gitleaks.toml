# Gitleaks allowlist for LaundryTwin (CE-Project-2026)
#
# Extend ONLY with documented false positives. Every entry needs a reason.
# Real secrets never belong here — rotate them instead.
#
# Docs: https://github.com/gitleaks/gitleaks#configuration

[extend]
# Inherit the default gitleaks ruleset.
useDefault = true

[[allowlists]]
description = "LaundryTwin documented false positives"
regexTarget = "match"
regexes = [
    '''<airflow-admin-password>''',
    '''<analytics-read-api-key>''',
    '''<clickhouse-password>''',
    '''<from-\.env>''',
    '''__CH_PASSWORD__''',
]
