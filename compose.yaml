services:
  # One container serves the API and the SPA. They were two images with two
  # independent tags, but never two independent releases — the runbook deploys
  # them as a pair because the web reads fields the API change introduces. The
  # API process also answers the static routes (WEB_ROOT, apps/api/src/spa.ts),
  # which is what nginx used to do, so there is no sidecar left to keep in step.
  app:
    image: ${APP_IMAGE:-laundrytwin:latest}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_PATH: /data/laundrytwin.sqlite
      WEB_ROOT: /app/public
    ports:
      - "8787:8787"
    restart: unless-stopped
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  etl:
    image: ${ETL_IMAGE:-laundrytwin-etl:latest}
    env_file: ${ETL_ENV_FILE:-/opt/laundrytwin-etl/.env}
    volumes:
      - /opt/laundrytwin-etl/data:/data
    network_mode: host
    restart: unless-stopped

  weather:
    image: ${WEATHER_IMAGE:-laundrytwin-weather:latest}
    # Its own env file, not ETL_ENV_FILE: the collector reads TMD + ClickHouse
    # and never IRIS Postgres. Sharing the ETL env handed this container a
    # PG_CONNECTION_STRING it cannot use.
    env_file: ${WEATHER_ENV_FILE:-/opt/laundrytwin/weather.env}
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 5m
      timeout: 5s
      retries: 1

  gas:
    image: ${GAS_IMAGE:-laundrytwin-gas:latest}
    # Behind a profile so an ordinary `docker compose up -d` cannot fail on it.
    # The image is not built yet and Home Assistant has no token provisioned,
    # so starting this service today would only produce a pull error or an
    # auth failure that looks like a stack problem. Enable deliberately:
    #   sudo docker compose --profile gas up -d gas
    profiles: ["gas"]
    # Its own env file for the same reason as weather: this collector reads
    # Home Assistant + ClickHouse and never IRIS Postgres. HA_BASE_URL,
    # HA_TOKEN, GAS_TENANT_ID, GAS_BRANCH_ID, GAS_BRANCH_SLUG,
    # GAS_LOOKBACK_HOURS and CLICKHOUSE_* live here (600, not in git).
    env_file: ${GAS_ENV_FILE:-/opt/laundrytwin/gas.env}
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 5m
      timeout: 5s
      retries: 1
