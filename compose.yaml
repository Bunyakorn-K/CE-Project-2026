services:
  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_PATH: /data/laundrytwin.sqlite
    restart: unless-stopped
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      target: web
      args:
        VITE_LIFF_ID: ${VITE_LIFF_ID:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
