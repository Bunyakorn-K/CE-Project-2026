services:
  api:
    image: ${API_IMAGE:-laundrytwin-api:latest}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_PATH: /data/laundrytwin.sqlite
    ports:
      - "8787:8787"
    restart: unless-stopped
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    image: ${WEB_IMAGE:-laundrytwin-web:latest}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  etl:
    image: ${ETL_IMAGE:-laundrytwin-etl:latest}
    env_file: ${ETL_ENV_FILE:-/opt/laundrytwin-etl/.env}
    volumes:
      - /opt/laundrytwin-etl/data:/data
    network_mode: host
    restart: unless-stopped

  weather:
    image: ${WEATHER_IMAGE:-laundrytwin-weather:latest}
    env_file: ${ETL_ENV_FILE:-/opt/laundrytwin-etl/.env}
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 5m
      timeout: 5s
      retries: 1
