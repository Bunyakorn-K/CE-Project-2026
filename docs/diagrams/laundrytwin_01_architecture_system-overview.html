<title>LaundryTwin — System Design</title>
<style>
  :root {
    --paper: #faf7f2;
    --ink: #23282f;
    --stroke: #5b6b85;
    --border: #7e8fab;
    --red: #b32b22;
    --muted: #6b7789;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Inter, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  .poster { width: 100%; max-width: 1720px; margin: 0 auto; }
  svg.diagram { display: block; width: 100%; height: auto; }
  .t-title  { font-size: 78px; font-weight: 700; letter-spacing: -2px; fill: var(--red); }
  .t-sub    { font-size: 17px; font-weight: 400; fill: var(--muted); }
  .t-node   { font-size: 16.5px; font-weight: 400; fill: var(--ink); }
  .t-bold   { font-size: 16.5px; font-weight: 700; fill: var(--ink); }
  .t-box    { font-size: 16.5px; font-weight: 700; fill: #1c2229; }
  .t-small  { font-size: 11.5px; font-weight: 700; fill: #2c333c; letter-spacing: .4px; }
  .t-cap    { font-size: 12.5px; font-weight: 400; fill: var(--muted); }
  .t-mono   { font-family: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
              font-size: 12px; fill: #2b323b; }
  .t-chip   { font-family: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
              font-size: 10.5px; fill: #2b323b; }
  .flow     { fill: none; stroke: var(--stroke); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .icon     { fill: none; stroke: #333b47; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .frame    { fill: none; stroke: var(--border); stroke-width: 1.6; }
  .chip     { fill: none; stroke: #a9b8cc; stroke-width: 1.3; }
</style>
